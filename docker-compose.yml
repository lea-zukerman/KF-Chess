# Stage 1 of Server_Design.md section 12: the existing single-process
# server, containerised, with its user data moved out to PostgreSQL.
# Splitting the server into gateway/shards comes in stage 3.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kfchess
      POSTGRES_PASSWORD: kfchess
      POSTGRES_DB: kfchess
    # depends_on only waits for the container to start, not for the
    # database to accept connections -- without this the app connects
    # too early and dies on boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfchess -d kfchess"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # No volume, deliberately. Everything Redis holds here is short-lived
  # by nature -- a queue entry, a session, a live room -- so losing it
  # costs a re-queue, not data. See Server_Design.md section 4.2.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Gateway and shard run the same image with a different command: the split
  # is a matter of which entry point runs, not of two codebases.
  gateway:
    build:
      context: .
      args:
        # Empty unless the environment sets it, so an ordinary build
        # verifies certificates. See the note in the Dockerfile.
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST-}
    environment:
      # "postgres" is the service name above; Compose resolves it over
      # its internal DNS, the same way a Service name resolves in k8s.
      DB_URL: postgresql://kfchess:kfchess@postgres:5432/kfchess
      REDIS_URL: redis://redis:6379
      SHARD_HOST: shard
      SHARD_PORT: "8766"
    ports:
      - "8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  shard:
    build:
      context: .
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST-}
    command: ["python", "-m", "services.shard", "--host", "0.0.0.0", "--port", "8766"]
    environment:
      DB_URL: postgresql://kfchess:kfchess@postgres:5432/kfchess
    # Not published: only gateways reach a shard, never a browser.
    expose:
      - "8766"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
